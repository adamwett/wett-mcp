[project]
name = "wett-mcp"
version = "0.1.0"
description = "Remote MCP connector for a homelab: OAuth 2.1 behind Cloudflare Access, allowlisted tools"
requires-python = ">=3.12"
dependencies = ["mcp>=1.26", "pyjwt[crypto]>=2.10", "httpx", "uvicorn", "starlette"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
wett-mcp = "wett_mcp.server:main"
wett-mcp-hostd = "wett_mcp.hostd:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
